# 푸시·PR 마다 빠른 검증: 순수 Kotlin 코어(도메인·파서) 테스트 + TypeScript/ESLint/Jest
# Android APK 는 EAS Build(클라우드) 또는 로컬 scripts/android-build.ps1 로 만든다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 코어 단위 테스트(JVM)
        run: chmod +x tools/core-jvm/gradlew && tools/core-jvm/gradlew -p tools/core-jvm test --console=plain

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
